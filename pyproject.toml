[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruleratchet"
dynamic = ["version"]
description = "Turn repeated agent friction into rules, and check that they held."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "Zair Naqvi"}]

[project.scripts]
ruleratchet = "ruleratchet:main"

[tool.setuptools]
py-modules = ["ruleratchet"]

[tool.setuptools.dynamic]
version = {attr = "ruleratchet.__version__"}
